apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-web-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EttorePannain/k8s-gitops-config.git
    targetRevision: main
    path: apps/catalog-web/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-gitops
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: false
