
name: Catalog Web CI

on:
  push:
    branches: [main]
    paths:
      - 'app-source/catalog-web/**'
      - '.github/workflows/catalog-web-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build local image
        run: |
          docker build \
            -t catalog-web-test:${{ github.sha }} \
            ./app-source/catalog-web

      - name: HTTP smoke test
        run: |
          docker run -d \
            --name catalog-web-test \
            -p 127.0.0.1:18060:80 \
            catalog-web-test:${{ github.sha }}

          trap 'docker rm -f catalog-web-test >/dev/null 2>&1 || true' EXIT

          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:18060/ \
              | grep -q 'Applicazione dimostrativa CI/GitOps'; then
              echo "HTTP test passed"
              exit 0
            fi
            sleep 1
          done

          exit 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ./app-source/catalog-web
          push: true
          tags: ghcr.io/ettorepannain/catalog-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/EttorePannain/k8s-gitops-config

      - name: Show published digest
        run: echo "Published digest ${{ steps.publish.outputs.digest }}"


      - name: Update GitOps image digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("apps/catalog-web/overlays/dev/kustomization.yaml")
          content = path.read_text()
          digest = os.environ["IMAGE_DIGEST"]

          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Invalid image digest")

          pattern = r"(?m)^([ \t]*digest:[ \t]*)sha256:[0-9a-f]{64}[ \t]*$"
          updated, count = re.subn(
              pattern,
              lambda match: match.group(1) + digest,
              content
          )

          if count != 1:
              raise SystemExit("Expected exactly one image digest")

          path.write_text(updated)
          PY

          git diff -- apps/catalog-web/overlays/dev/kustomization.yaml

      - name: Commit GitOps change
        run: |
          FILE=apps/catalog-web/overlays/dev/kustomization.yaml

          if git diff --quiet -- "$FILE"; then
            echo "GitOps digest unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          git commit -m "Update catalog-web image digest [skip ci]"
          git push origin HEAD:main
